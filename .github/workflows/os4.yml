name: OS4 Preview APK
on:
  workflow_dispatch:
  push:
    branches: [miuix-os4]
permissions:
  contents: read
concurrency:
  group: os4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Cache pinned Miuix preview
        id: miuix-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/top/yukonga/miuix
          key: miuix-android-ea1b935-v1
      - name: Build official OS4 preview from pinned source
        if: steps.miuix-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone https://github.com/compose-miuix-ui/miuix.git "$RUNNER_TEMP/miuix"
          cd "$RUNNER_TEMP/miuix"
          git checkout ea1b935ddba7bb25de816342b2e7a4ad2113bb46
          chmod +x gradlew
          tasks=()
          for m in miuix-core miuix-shader miuix-squircle miuix-ui miuix-blur miuix-glass; do
            tasks+=(":$m:publishKotlinMultiplatformPublicationToMavenLocal" ":$m:publishAndroidPublicationToMavenLocal")
          done
          ./gradlew "${tasks[@]}" --no-daemon --no-parallel --no-configuration-cache --stacktrace
      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TiebaLite-OS4-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        run: |
          echo '### TiebaLite OS4 Preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'Android 13+ · Miuix ea1b935 · signed debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo '设置 → 界面 → OS4 模糊精调' >> "$GITHUB_STEP_SUMMARY"
